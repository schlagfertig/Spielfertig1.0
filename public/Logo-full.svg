  <path d="M255 270 L348 388 L555 172" fill="none" stroke="#fff" stroke-width="48" stroke-linecap="butt" stroke-linejoin="miter"/>
  <text font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#fff" letter-spacing="3">
    <tspan x="145" y="366">SPIEL</tspan>
    <tspan x="428" y="366">FERTIG?</tspan>
