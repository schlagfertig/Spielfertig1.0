<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-label="Spiel Fertig">
  <rect width="800" height="700" fill="#000"/>
  <defs>
    <clipPath id="ringsTop"><rect x="0" y="0" width="800" height="318"/></clipPath>
    <clipPath id="ringsBot"><rect x="0" y="382" width="800" height="318"/></clipPath>
    <path id="nameArc" d="M 250 450 A 150 150 0 0 0 550 450"/>
  </defs>
  <g clip-path="url(#ringsTop)" fill="none" stroke="#5cc8b8">
    <circle cx="400" cy="350" r="268" stroke-width="11"/>
    <circle cx="400" cy="350" r="214" stroke-width="7"/>
    <circle cx="400" cy="350" r="164" stroke-width="5"/>
  </g>
  <g clip-path="url(#ringsBot)" fill="none" stroke="#5cc8b8">
    <circle cx="400" cy="350" r="268" stroke-width="11"/>
    <circle cx="400" cy="350" r="214" stroke-width="7"/>
  </g>
  <rect x="70" y="318" width="660" height="64" fill="#000"/>
  <line x1="70" y1="318" x2="730" y2="318" stroke="#5cc8b8" stroke-width="8"/>
